openapi: 3.1.0
info:
  title: Instagram Link — contrato alvo MVP
  version: 1.0.0
  description: Contrato alvo do MVP. Rotas implementadas com Supabase Auth descritas
    em openapi-m0.json e API.md. Integração Meta exige homologação M0.
servers:
- url: https://api.example.com
security:
- sessionCookie: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: login
      description: 'Papel permitido: público com rate limit. Ver spec/API.md para
        semântica e estados. Cria cookie HttpOnly Secure; obter token CSRF por auth/me
        conforme implementação.'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sessão ausente/inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflito de versão/idempotência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite de chamadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/v1/auth/logout:
