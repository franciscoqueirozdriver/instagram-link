  /api/v1/shopee/credentials:
    get:
      operationId: getShopeeCredentialStatus
      summary: Estado das credenciais Shopee da organização
      description: Admin da organização; retorna apenas estado e datas, nunca App ID ou App Secret.
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Estado sanitizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  configured_at:
                    type: [string, 'null']
                    format: date-time
                  updated_at:
                    type: [string, 'null']
                    format: date-time
                required: [configured, configured_at, updated_at]
                additionalProperties: false
        '401':
          description: Sessão ausente ou inválida
        '403':
          description: Administrador não autorizado nesta organização
    put:
      operationId: saveShopeeCredentials
      summary: Cadastrar ou substituir o par de credenciais da organização
      description: Admin somente. App Secret é write-only e a resposta não contém credenciais.
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                app_secret:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 512
              required: [app_id, app_secret]
              additionalProperties: false
      responses:
        '200':
          description: Credenciais cifradas e armazenadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                required: [configured]
                additionalProperties: false
        '401':
          description: Sessão ausente ou inválida
        '403':
          description: Administrador não autorizado nesta organização
        '422':
          description: Campos inválidos
