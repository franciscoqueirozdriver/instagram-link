  /webhooks/instagram:
    get:
      operationId: verifyWebhook
      security: []
      parameters:
      - name: hub.mode
        in: query
        required: true
        schema:
          type: string
      - name: hub.verify_token
        in: query
        required: true
        schema:
          type: string
      - name: hub.challenge
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Challenge validado
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: receiveWebhook
      security: []
      description: Assinatura obrigatória nos bytes brutos; formato Meta homologado
        no M0. Não usar o evento normalizado como payload externo. Commit antes do
        ACK.
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[a-fA-F0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Persistido ou duplicado autenticado
        '403':
          description: Assinatura inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload excedeu limite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Persistência indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    infraKey:
      type: apiKey
      in: header
      name: X-Infra-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
          - request_id
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Link:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          pattern: ^https://
        position:
          type: integer
          minimum: 1
      required:
      - label
      - url
      - position
      additionalProperties: false
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        links:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
      required:
      - name
      - links
      additionalProperties: false
    Product:
      type: object
      properties:
        id: *id001
        name:
          type: string
        description:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        status:
          type: string
          enum:
          - active
          - inactive
        version:
          type: integer
        created_at: *id004
      required:
      - id
      - name
      - links
      - status
      - version
      additionalProperties: false
    ProductPatch:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        links:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
        status:
          type: string
          enum:
          - active
          - inactive
      required:
      - expected_version
      additionalProperties: false
    CampaignInput:
      type: object
      properties:
        name: &id006
          type: string
          minLength: 1
          maxLength: 160
        media_id: *id001
        product_id: *id001
        keywords: &id007
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 100
        match_mode: &id008
          type: string
          enum:
          - whole_word
          - phrase
        template: &id009
